name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: |
          swiftc -O -o aimeter-arm64 -target arm64-apple-macosx12.0 MenuBarApp.swift \
              -framework AppKit -framework Foundation
          swiftc -O -o aimeter-x86_64 -target x86_64-apple-macosx12.0 MenuBarApp.swift \
              -framework AppKit -framework Foundation
          lipo -create -output aimeter aimeter-arm64 aimeter-x86_64
          file aimeter

      - name: Create release tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p "aimeter-${VERSION}"
          cp aimeter aimeter_daemon.py aimeter_cli.py \
             index.html index.css dashboard.js \
             com.aimeter.app.plist install.sh \
             "aimeter-${VERSION}/"
          tar czf "aimeter-${VERSION}.tar.gz" "aimeter-${VERSION}"
          shasum -a 256 "aimeter-${VERSION}.tar.gz" > "aimeter-${VERSION}.tar.gz.sha256"

      - name: Build macOS App Bundle and DMG
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # We need to compile local architecture, but release needs universal, so use build_app.sh and update executable to universal
          chmod +x build_app.sh
          ./build_app.sh
          cp aimeter AIMeter.app/Contents/MacOS/aimeter
          sed -i '' "s|<string>0.2.2</string>|<string>${VERSION}</string>|" AIMeter.app/Contents/Info.plist
          hdiutil create -volname "AIMeter" -srcfolder AIMeter.app -ov -format UDZO "AIMeter.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aimeter-*.tar.gz
            aimeter-*.tar.gz.sha256
            AIMeter.dmg
          generate_release_notes: true

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          SHA256=$(cat "aimeter-${VERSION}.tar.gz.sha256" | awk '{print $1}')
          URL="https://github.com/smriti-memcore/aimeter/releases/download/${VERSION}/aimeter-${VERSION}.tar.gz"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/smriti-memcore/homebrew-aimeter.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cp "${GITHUB_WORKSPACE}/Formula/aimeter.rb" Formula/aimeter.rb
          sed -i '' "s|url \".*\"|url \"${URL}\"|" Formula/aimeter.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/aimeter.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "update-${VERSION}"
          git add Formula/aimeter.rb
          git commit -m "Update aimeter to ${VERSION}"
          git push origin "update-${VERSION}" --force

          curl -X POST \
            -H "Authorization: token ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/smriti-memcore/homebrew-aimeter/pulls" \
            -d "{\"title\":\"Update aimeter to ${VERSION}\",\"head\":\"update-${VERSION}\",\"base\":\"main\",\"body\":\"Automated formula update from release workflow.\"}"
